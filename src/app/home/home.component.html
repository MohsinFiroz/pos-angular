<nb-layout>
    <nb-layout-header fixed>
        Point of Sale
      </nb-layout-header>
<nb-layout-column class="colored-column-success">
    <mat-grid-list cols="3" rowHeight="2:1">
        <mat-grid-tile  *ngFor="let product of products">
            <div class="container" (click)="add(product)">
              <img src="https://source.unsplash.com/featured/?{{ product.name }}" alt="Snow" style="width:100%;">
              <div class="centered">{{ product.name }} </div>
            </div> 
        </mat-grid-tile>
      </mat-grid-list>
  </nb-layout-column>
  <nb-layout-column class="colored-column-warning">Firoz</nb-layout-column>
  <nb-layout-column left class="colored-column-info">
      <nb-card id="card">
        <nb-card-header>Items</nb-card-header>
        <nb-card-body>
          <nb-list >
            <nb-list-item *ngFor="let product of cart.items">
              {{product.name}}
            </nb-list-item>
          </nb-list>
        </nb-card-body>
        <nb-card-footer>Total: $ {{cart.total}} </nb-card-footer>
      </nb-card>  
  </nb-layout-column>

  <nb-layout-footer fixed>
    Made with ❤ in Australia
  </nb-layout-footer>
</nb-layout>
