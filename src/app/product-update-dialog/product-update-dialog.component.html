<nb-card class="dialogCard">
    <nb-card-header>Update the product</nb-card-header>
    <nb-card-body>
      <input #name nbInput placeholder="Name">
      <input #price nbInput placeholder="Price">
    </nb-card-body>
    <nb-card-footer>
      <button nbButton status="danger" (click)="cancel()">Cancel</button>
      <button nbButton status="success" (click)="submit(name.value, price.value)">Submit</button>
    </nb-card-footer>
  </nb-card>
